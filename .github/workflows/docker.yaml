name: Build, verify, and release container images

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]*.[0-9]*.[0-9]*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Validate release contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      validation_matrix: ${{ steps.release.outputs.validation_matrix }}
      publish_matrix: ${{ steps.release.outputs.publish_matrix }}
      platforms: ${{ steps.release.outputs.platforms }}
      final_base: ${{ steps.release.outputs.final_base }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_date: ${{ steps.release.outputs.source_date }}
      is_release: ${{ steps.release.outputs.is_release }}
      is_publish: ${{ steps.release.outputs.is_publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate config and event authority
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${SOURCE_SHA}^{commit}")"
          if [[ "$REF_TYPE" == tag ]] && \
            ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "Release tag must point to a commit reachable from main" >&2
            exit 1
          fi

          source_date="$(git show -s --format=%cI "$source_sha")"
          validation_matrix="$(python3 scripts/release.py matrix --kind validate)"
          publish_matrix="$(python3 scripts/release.py matrix --kind publish)"
          platforms="$(python3 scripts/release.py platforms --format csv)"
          final_base=validation
          release_tag=
          is_release=false
          is_publish=false

          if [[ "$REF_TYPE" == tag ]]; then
            : >"${RUNNER_TEMP}/existing-release-tags"
            while IFS= read -r existing_tag; do
              if [[ "$existing_tag" != "$REF_NAME" ]]; then
                printf '%s\n' "$existing_tag" >>"${RUNNER_TEMP}/existing-release-tags"
              fi
            done < <(git tag --list)
            python3 scripts/release.py validate-tag "$REF_NAME" \
              --existing-tags "${RUNNER_TEMP}/existing-release-tags"
            final_base="$REF_NAME"
            release_tag="$REF_NAME"
            is_release=true
          elif [[ "$REF" == refs/heads/main ]]; then
            final_base=main
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            final_base="pr-${{ github.event.pull_request.number }}"
          fi

          if [[ "$EVENT_NAME" == push ]] && {
            [[ "$REF" == refs/heads/main ]] || [[ "$REF_TYPE" == tag ]]
          }; then
            is_publish=true
          fi

          {
            echo "validation_matrix=$validation_matrix"
            echo "publish_matrix=$publish_matrix"
            echo "platforms=$platforms"
            echo "final_base=$final_base"
            echo "source_sha=$source_sha"
            echo "source_date=$source_date"
            echo "is_release=$is_release"
            echo "is_publish=$is_publish"
            echo "release_tag=$release_tag"
          } >>"$GITHUB_OUTPUT"

  guard_release:
    name: Reject an existing GitHub Release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse to recreate a published release
        if: needs.prepare.outputs.is_publish == 'true' && needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>release-error; then
            echo "GitHub Release $RELEASE_TAG already exists; create a new version" >&2
            exit 1
          fi
          error="$(<release-error)"
          if [[ "$error" != *"release not found"* ]]; then
            printf '%s\n' "$error" >&2
            exit 1
          fi

  validate:
    name: Validate ${{ matrix.pg_version }} / ${{ matrix.distro }} / ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.validation_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          cache-binary: false
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Derive local test image name
        id: test_name
        env:
          PG_VERSION: ${{ matrix.pg_version }}
          PATRONI_VERSION: ${{ matrix.patroni_version }}
          DISTRO: ${{ matrix.distro }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          architecture="${PLATFORM#linux/}"
          echo "image=local/patroni:${PG_VERSION}-${PATRONI_VERSION}-${DISTRO}-${architecture}" >>"$GITHUB_OUTPUT"

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.test_name.outputs.image }}
          build-args: |
            DISTRO=${{ matrix.distro }}
            PG_VERSION=${{ matrix.pg_version }}
            PATRONI_VERSION=${{ matrix.patroni_version }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ needs.prepare.outputs.source_sha }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.source_date }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=validate-${{ matrix.pg_version }}-${{ matrix.patroni_version }}-${{ matrix.distro }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.pg_version }}-${{ matrix.patroni_version }}-${{ matrix.distro }}-${{ matrix.platform }}

      - name: Smoke-test Patroni and PostgreSQL
        env:
          IMAGE: ${{ steps.test_name.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker run --rm --platform "$PLATFORM" "$IMAGE" patroni --version
          docker run --rm --platform "$PLATFORM" --entrypoint /bin/sh "$IMAGE" -c 'postgres --version'

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: false

      - name: Scan test image
        env:
          IMAGE: ${{ steps.test_name.outputs.image }}
        run: |
          set -euo pipefail
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "$IMAGE"

  publish_candidates:
    name: Publish candidate ${{ matrix.pg_version }} / ${{ matrix.distro }}
    needs:
      - prepare
      - guard_release
      - validate
    if: needs.prepare.outputs.is_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.publish_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require both registry credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_PASSWORD" ]]; then
            echo "Both Docker Hub credentials are required; refusing a partial publication" >&2
            exit 1
          fi

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          cache-binary: false
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Derive candidate and final tags
        id: names
        env:
          PG_VERSION: ${{ matrix.pg_version }}
          PATRONI_VERSION: ${{ matrix.patroni_version }}
          DISTRO: ${{ matrix.distro }}
          FINAL_BASE: ${{ needs.prepare.outputs.final_base }}
        run: |
          set -euo pipefail
          suffix="${PG_VERSION}-${PATRONI_VERSION}-${DISTRO}"
          candidate="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}"
          final="${FINAL_BASE}-${suffix}"
          {
            echo "suffix=$suffix"
            echo "candidate=$candidate"
            echo "final=$final"
          } >>"$GITHUB_OUTPUT"

      - name: Build once and push candidate to both registries
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          push: true
          platforms: ${{ needs.prepare.outputs.platforms }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.names.outputs.candidate }}
            docker.io/${{ env.IMAGE_NAME }}:${{ steps.names.outputs.candidate }}
          build-args: |
            DISTRO=${{ matrix.distro }}
            PG_VERSION=${{ matrix.pg_version }}
            PATRONI_VERSION=${{ matrix.patroni_version }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ needs.prepare.outputs.source_sha }}
          labels: |
            org.opencontainers.image.title=Patroni ${{ matrix.patroni_version }} with PostgreSQL ${{ matrix.pg_version }} (${{ matrix.distro }})
            org.opencontainers.image.description=Signed multi-platform Patroni image
            org.opencontainers.image.created=${{ needs.prepare.outputs.source_date }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.final }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.pg_version }}-${{ matrix.patroni_version }}-${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.pg_version }}-${{ matrix.patroni_version }}-${{ matrix.distro }}

      - name: Close candidate digest and platform evidence
        id: evidence
        env:
          CANDIDATE_TAG: ${{ steps.names.outputs.candidate }}
          EXPECTED_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          ghcr_ref="ghcr.io/${IMAGE_NAME}:${CANDIDATE_TAG}"
          docker_ref="docker.io/${IMAGE_NAME}:${CANDIDATE_TAG}"
          docker buildx imagetools inspect "$ghcr_ref" --format '{{json .Manifest}}' >candidate-evidence/ghcr-index.json
          docker buildx imagetools inspect "$docker_ref" --format '{{json .Manifest}}' >candidate-evidence/docker-index.json

          expected="$(python3 scripts/release.py platforms --format json)"
          platform_map() {
            jq -Sce '
              [.manifests[]
                | select(.platform.os == "linux" and .platform.architecture != "unknown")
                | {key: (.platform.os + "/" + .platform.architecture), value: .digest}]
              | from_entries
            ' "$1"
          }
          require_exact_platforms() {
            actual="$(platform_map "$1" | jq -c 'keys | sort')"
            wanted="$(printf '%s' "$expected" | jq -c 'sort')"
            if [[ "$actual" != "$wanted" ]]; then
              echo "$2 platform set differs: expected=$wanted actual=$actual" >&2
              exit 1
            fi
          }

          require_exact_platforms candidate-evidence/ghcr-index.json GHCR
          require_exact_platforms candidate-evidence/docker-index.json DockerHub
          ghcr_platforms="$(platform_map candidate-evidence/ghcr-index.json)"
          docker_platforms="$(platform_map candidate-evidence/docker-index.json)"
          if [[ "$ghcr_platforms" != "$docker_platforms" ]]; then
            echo "Registry mirrors have different runnable platform digests" >&2
            exit 1
          fi

          ghcr_digest="$(jq -er '.digest' candidate-evidence/ghcr-index.json)"
          docker_digest="$(jq -er '.digest' candidate-evidence/docker-index.json)"
          {
            echo "ghcr_digest=$ghcr_digest"
            echo "docker_digest=$docker_digest"
            echo "ghcr_platforms=$ghcr_platforms"
            echo "docker_platforms=$docker_platforms"
          } >>"$GITHUB_OUTPUT"

      - name: Smoke-test exact published platform digests
        env:
          GHCR_DIGEST: ${{ steps.evidence.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          while IFS= read -r platform; do
            docker run --rm --platform "$platform" "ghcr.io/${IMAGE_NAME}@${GHCR_DIGEST}" patroni --version
            docker run --rm --platform "$platform" --entrypoint /bin/sh \
              "ghcr.io/${IMAGE_NAME}@${GHCR_DIGEST}" -c 'postgres --version'
          done < <(python3 scripts/release.py platforms)

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: false

      - name: Scan exact published platform digests
        env:
          GHCR_DIGEST: ${{ steps.evidence.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          while IFS= read -r platform; do
            trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --platform "$platform" \
              --severity HIGH,CRITICAL \
              "ghcr.io/${IMAGE_NAME}@${GHCR_DIGEST}"
          done < <(python3 scripts/release.py platforms)

      - name: Attest GHCR provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.evidence.outputs.ghcr_digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign exact candidate digests in both registries
        env:
          GHCR_DIGEST: ${{ steps.evidence.outputs.ghcr_digest }}
          DOCKER_DIGEST: ${{ steps.evidence.outputs.docker_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${IMAGE_NAME}@${GHCR_DIGEST}"
          cosign sign --yes "docker.io/${IMAGE_NAME}@${DOCKER_DIGEST}"

      - name: Write closed candidate evidence
        env:
          PG_VERSION: ${{ matrix.pg_version }}
          PATRONI_VERSION: ${{ matrix.patroni_version }}
          DISTRO: ${{ matrix.distro }}
          CANDIDATE_TAG: ${{ steps.names.outputs.candidate }}
          FINAL_TAG: ${{ steps.names.outputs.final }}
          GHCR_DIGEST: ${{ steps.evidence.outputs.ghcr_digest }}
          DOCKER_DIGEST: ${{ steps.evidence.outputs.docker_digest }}
          GHCR_PLATFORMS: ${{ steps.evidence.outputs.ghcr_platforms }}
          DOCKER_PLATFORMS: ${{ steps.evidence.outputs.docker_platforms }}
          SUFFIX: ${{ steps.names.outputs.suffix }}
        run: |
          set -euo pipefail
          jq -n \
            --arg pg_version "$PG_VERSION" \
            --arg patroni_version "$PATRONI_VERSION" \
            --arg distro "$DISTRO" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg final_tag "$FINAL_TAG" \
            --arg ghcr_digest "$GHCR_DIGEST" \
            --arg docker_digest "$DOCKER_DIGEST" \
            --argjson ghcr_platform_digests "$GHCR_PLATFORMS" \
            --argjson docker_platform_digests "$DOCKER_PLATFORMS" \
            '{
              pg_version: $pg_version,
              patroni_version: $patroni_version,
              distro: $distro,
              candidate_tag: $candidate_tag,
              final_tag: $final_tag,
              ghcr_digest: $ghcr_digest,
              docker_digest: $docker_digest,
              ghcr_platform_digests: $ghcr_platform_digests,
              docker_platform_digests: $docker_platform_digests,
              verification: {
                smoke: "passed",
                trivy: "passed",
                sbom: "attached",
                buildkit_provenance: "attached",
                github_provenance: "attested",
                ghcr_signature: "signed",
                docker_signature: "signed"
              }
            }' >"candidate-evidence/${SUFFIX}.json"

      - name: Upload candidate evidence by digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ steps.names.outputs.suffix }}
          path: candidate-evidence/${{ steps.names.outputs.suffix }}.json
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote verified digests
    needs:
      - prepare
      - publish_candidates
    if: needs.prepare.outputs.is_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      artifact-metadata: read
    outputs:
      release_manifest: ${{ steps.promote.outputs.release_manifest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          cache-binary: false
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Download all closed candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: candidate-evidence
          merge-multiple: true

      - name: Build complete machine-readable release manifest
        env:
          FINAL_BASE: ${{ needs.prepare.outputs.final_base }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/release.py manifest \
            --base-tag "$FINAL_BASE" \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts-dir candidate-evidence \
            | jq . >release-manifest.json

      - name: Promote only closed digests and verify final evidence
        id: promote
        env:
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yaml@${GITHUB_REF}"

          inspect_manifest() {
            local ref="$1"
            local output="$2"
            local error_file="$3"
            if docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' >"$output" 2>"$error_file"; then
              return 0
            fi
            local error
            error="$(<"$error_file")"
            if [[ "$error" == *"not found"* || "$error" == *"manifest unknown"* || "$error" == *"name unknown"* ]]; then
              return 1
            fi
            printf '%s\n' "$error" >&2
            return 2
          }

          promote_ref() {
            local final_ref="$1"
            local source_ref="$2"
            local expected_digest="$3"
            local registry="$4"
            local before="${RUNNER_TEMP}/${registry}-before.json"
            local after="${RUNNER_TEMP}/${registry}-after.json"
            local error_file="${RUNNER_TEMP}/${registry}-inspect.err"

            if inspect_manifest "$final_ref" "$before" "$error_file"; then
              current_digest="$(jq -er '.digest' "$before")"
              if [[ "$IS_RELEASE" == true && "$current_digest" != "$expected_digest" ]]; then
                echo "Refusing to overwrite immutable $final_ref: current=$current_digest expected=$expected_digest" >&2
                exit 1
              fi
              if [[ "$current_digest" == "$expected_digest" ]]; then
                echo "$final_ref already points to the verified digest; resuming"
              else
                docker buildx imagetools create --tag "$final_ref" "$source_ref"
              fi
            else
              status=$?
              if [[ $status -ne 1 ]]; then
                exit "$status"
              fi
              docker buildx imagetools create --tag "$final_ref" "$source_ref"
            fi

            docker buildx imagetools inspect "$final_ref" --format '{{json .Manifest}}' >"$after"
            actual_digest="$(jq -er '.digest' "$after")"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "Promotion digest mismatch for $final_ref: actual=$actual_digest expected=$expected_digest" >&2
              exit 1
            fi
          }

          platform_map() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | jq -Sce '
                  [.manifests[]
                    | select(.platform.os == "linux" and .platform.architecture != "unknown")
                    | {key: (.platform.os + "/" + .platform.architecture), value: .digest}]
                  | from_entries
                '
          }

          while IFS= read -r image; do
            ghcr_ref="$(jq -r '.ghcr_ref' <<<"$image")"
            docker_ref="$(jq -r '.docker_ref' <<<"$image")"
            ghcr_digest="$(jq -r '.ghcr_digest' <<<"$image")"
            docker_digest="$(jq -r '.docker_digest' <<<"$image")"
            expected_platforms="$(jq -c '.ghcr_platform_digests' <<<"$image")"

            promote_ref "$ghcr_ref" "ghcr.io/${IMAGE_NAME}@${ghcr_digest}" "$ghcr_digest" ghcr
            promote_ref "$docker_ref" "docker.io/${IMAGE_NAME}@${docker_digest}" "$docker_digest" docker

            ghcr_actual="$(platform_map "$ghcr_ref")"
            docker_actual="$(platform_map "$docker_ref")"
            if [[ "$ghcr_actual" != "$expected_platforms" || "$docker_actual" != "$expected_platforms" ]]; then
              echo "Final platform evidence differs from the closed candidate manifest" >&2
              exit 1
            fi

            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${ghcr_ref}@${ghcr_digest}" >/dev/null
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${docker_ref}@${docker_digest}" >/dev/null
            gh attestation verify "oci://ghcr.io/${IMAGE_NAME}@${ghcr_digest}" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done < <(jq -c '.images[]' release-manifest.json)

          echo "release_manifest=$(jq -c . release-manifest.json)" >>"$GITHUB_OUTPUT"

      - name: Preserve published manifest as workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

  github_release:
    name: Create GitHub Release
    needs:
      - prepare
      - promote
    if: needs.prepare.outputs.is_publish == 'true' && needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate release notes and machine manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_MANIFEST: ${{ needs.promote.outputs.release_manifest }}
        run: |
          set -euo pipefail
          python3 -c 'import json, os; print(json.dumps(json.loads(os.environ["RELEASE_MANIFEST"]), indent=2))' \
            >release-manifest.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq .body >generated-changes.md
          python3 scripts/release.py notes \
            --manifest release-manifest.json \
            --changes generated-changes.md \
            >release-notes.md

      - name: Create GitHub Release only after every image is verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          title="$(python3 scripts/release.py title "$RELEASE_TAG")"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$title" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            'release-manifest.json#Machine-readable release manifest'
